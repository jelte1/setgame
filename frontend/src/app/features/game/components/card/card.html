@if (card()) {
  <div class="card" [class.hinted]="hinted()" [class.selected]="selected()">
    @for (amount of getCardAmount(); track amount) {
      <svg viewBox="0 0 150 95">
        <use
          [attr.href]="'#' + getCardShape()"
          [attr.stroke]="getCardColor()"
          [attr.fill]="getCardFilling()"
          stroke-width="4"/>
      </svg>
    }
  </div>
} @else {
  <p>Card error.</p>
}
