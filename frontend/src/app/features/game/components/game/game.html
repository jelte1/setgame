<main>
  @if (loading()) {
    <p>Loading game...</p>
  } @else if (game(); as currentGame) {
    <div class="container">
      <div class="miniContainer">
        <h2>Game Details</h2>
        <button [routerLink]="['/games']">Back to overview</button>
      </div>

      <app-statistics [game]="currentGame" [tableCards]="tableCards().length" [cardsInDeck]="cardsInDeck().length"/>

      <button class="showHint" (click)="showHint()">Get a Hint!</button>

      <div class="gameBox">
        <app-board [cards]="tableCards()" [selectedCards]="selectedCards()" [hintedCards]="hintedCards()" (cardClicked)="selectCard($event)"/>
        <app-found-sets [foundSets]="currentGame.foundSets"/>
      </div>
    </div>
  } @else {
    <div class="container">
      <h1>Game Not Found</h1>
      <p>A game with that ID does not exist.</p>
    </div>
  }
</main>
