<div class="found-sets">
  <h2 style="text-align: center">Found Sets</h2>
  <div class="board-wrapper">
      <div class="board">
        @for (set of foundSets().slice().reverse(); track set.id) {
          <div class="set">
            <app-card [card]="set.card1"/>
            <app-card [card]="set.card2"/>
            <app-card [card]="set.card3"/>
          </div>
        } @empty {
          <p>No sets found yet.</p>
        }
      </div>
  </div>
</div>
