<main>
  <div class="container">
    <div class="miniContainer">
      <h2>Games</h2>
      <button class="createGameButton" (click)="createGame()">Create New Game</button>
    </div>
    <p>Your games:</p>
    <ul>
      @for (game of games(); track game.id) {
        <li>
          <a [routerLink]="['/games', game.id]">{{ game.createdAt | refactorDate }}</a>
        </li>
      } @empty {
        <p>No games found.</p>
      }
    </ul>
  </div>
</main>
