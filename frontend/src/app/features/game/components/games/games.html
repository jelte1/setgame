<main>
  <div class="container">
    <h1>Games</h1>
    <p>View your games here:</p>
    <ul>
      @for (game of games(); track game.id) {
        <li>
          <a [routerLink]="['/games', game.id]">{{ game.createdAt }}</a>
        </li>
      } @empty {
        <p>No games found.</p>
      }
    </ul>
  </div>
</main>
