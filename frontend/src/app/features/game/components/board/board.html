<main>
  <div class="board-wrapper">
    <div class="board">
      @for (card of cards(); track card.id) {
        <app-card [card]="card" [selected]="isSelected(card)" [hinted]="isHinted(card)" (click)="cardClicked.emit(card)"/>
      } @empty {
        <p>Board not available.</p>
      }
    </div>
  </div>
</main>
